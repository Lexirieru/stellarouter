name: CI

# Trigger: manual (Actions tab) until the GitHub account billing lock is lifted —
# right now every push fails after 2s with "account is locked due to a billing
# issue" and pollutes the commit status. Restore push/pull_request afterwards:
#   push: { branches: [main] }
#   pull_request:
on:
  workflow_dispatch:

jobs:
  contract:
    name: Contract — cargo test + wasm build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: smart-contract
      - name: Unit tests (9 tests)
        run: cargo test -p credits
      - name: Build contract wasm
        run: cargo build -p credits --target wasm32v1-none --release

  frontend:
    name: Frontend — lint + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install workspace deps
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
        working-directory: frontend
      - name: Unit tests
        run: bun test src
        working-directory: frontend
      - name: Build console
        run: bun run build
        working-directory: frontend

  gateway:
    name: Gateway — install + boot check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Unit tests (model policy)
        run: bun test src
      - name: Server boots and refuses to run without OZ_API_KEY
        run: |
          set +e
          node src/server.js > boot.log 2>&1
          code=$?
          set -e
          cat boot.log
          # without OZ_API_KEY the server must exit non-zero with a clear message
          test $code -ne 0 && grep -qi "OZ_API_KEY" boot.log
